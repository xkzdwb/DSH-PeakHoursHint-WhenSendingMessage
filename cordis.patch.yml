# peak-hint — 输入框占位符里的峰谷提示。
#
# 在每个输入框的浅色提示文字后面追加一句「现在高峰时段」或「现在低谷时段」，
# 让「现在发这条消息按哪个价计费」一眼可见。
#
# 判定规则（与 DeepSeek 官方计费窗口一致）：
#   高峰 = 北京时间 周一至周五 09:00–12:00、14:00–18:00，且不在法定节假日表里
#   低谷 = 其余时间：周末、法定节假日全天、工作日窗口之外
#
# Host 半边只做一件事：一条只读 GET 路由 /plugin-peak-hint/state，返回当前
# phase、命中的原因（weekend / holiday / window / outside-window）和本地时间。
# Client 半边轮询它，给占位符元素加 data 属性，由一段 CSS 拼出尾句；
# 不改宿主渲染的文本节点，也不替换 composer 组件。
- insert:
    - id: peak-hint
      name: 'dsh-peak-hours-hint'
      config:
        # 判定使用的时区。默认北京时间；改这里等于改「几点算高峰」。
        timeZone: Asia/Shanghai
        # 哪几天算工作日。0=周日 … 6=周六。
        weekdays: [1, 2, 3, 4, 5]
        # 高峰窗口，左闭右开。24:00 表示到当天结束。
        windows:
          - start: '09:00'
            end: '12:00'
          - start: '14:00'
            end: '18:00'
        # 法定节假日表，形状 {"2026": ["2026-01-01", ...]}。
        # 留空 = 用本包自带的 cn-holidays.json（每年国务院公布次年安排后更新它）。
        # 填绝对路径就读那一份；读不出来会退回自带副本，并在路由返回的 holidayError 里说明原因。
        holidaysPath: ''
